<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <div class="form">
    <div class="container">
      <h1 class="form__title">Калькулятор стоимости доставки </h1>
      
        <form class="form-box" action="#" method=" post">
          <div class="form__data">
            <label class="form__label" for="product-title">Название товаро:
              <input class="form__field" id="product-title" type="text" name="product-title" required> <!--required-->
            </label>
            <label class="form__label" for="product-weight">Вес товара (кг):
              <input class="form__field" id="product-weight" type="number" name="product-weight" required >
            </label>
            <label class="form__label" for="product-distance">Расстояние доставки (км):
              <input class="form__field" id="product-distance" type="number" name="product-distance" required>
            </label>
          </div>

          <button class="form__btn" type="submit">Добавить товар</button>
        </form>
      <p class="text-error">Пожалуйста введите корректое значение для веса и расстояния</p>
      
      <table class="product-table">
        <thead>
          <tr class="product__header">
            <th class="product__title">Название товара</th>
            <th class="product__weight">Вес (кг)</th>
            <th class="product__distance">Расстояние (км)</th>
            <th class="product__price">Стоимость доставки</th>
          </tr>
        </thead>

        <tbody class="product__tbody"></tbody>
      </table>

      <script src="index.js"></script>
    </div>
  </div>
</body>

</html>
