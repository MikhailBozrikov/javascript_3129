<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>«Практика работы с JSON и LocalStorage» в модуле 
    «Хранение данных в браузере»</title>
  <link rel="stylesheet" type="text/css" href="styles.css" />
</head>

<body>
  <form id="film-form">
    <label for="title">Название:</label><br />
    <input type="text" id="title" name="title" required><br>
    <label for="genre">Жанр:</label><br />
    <input type="text" id="genre" name="genre" required><br>
    <label for="releaseYear">Год:</label><br>
    <input type="number" id="releaseYear" name="releaseYear" required><br>
    <input type="checkbox" id="isWatched" name="isWatched">
    <label for="isWatched">Успели посмотреть?</label><br >

    <!-- <input type="submit" value="Submit"> -->
    <button class="submit" type="submit">Submit</button>
    <div class="controls">
      <button type="submit">Обновить</button>
      <button type="reset">Отменить</button>
    </div>
  </form>
    <select class="select-list" id="color" name="color">
      <option class="item-option" value="title">Название</option>
      <option class="form-option" value="genre">Жанр</option>
      <option class="form-option" value="releaseYear">Год</option>
    </select>
    <button class="sort-btn">Сортировать</button>
  
  <table id="film-table">
    <thead>
      <tr>
        <th>Название</th>
        <th>Жанр</th>
        <th>Год</th>
        <th>Успели посмотреть?</th>
        <th>Действие</th>
      </tr>
    </thead>
    <tbody id="film-tbody">
      <!-- Здесь будут вставлены строки -->
    </tbody>
  </table>
  <script src="script.js"></script>
</body>

</html>
